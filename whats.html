<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="whatsapp">
    <!-- Left Navigation Tabs -->
    <nav class="left-tabs">
      <div class="menu-icon">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="tab-list">
        <button class="tab active" title="Chats">💬</button>
        <button class="tab" title="Status">🟢</button>
        <button class="tab" title="Communities">👥</button>
        <button class="tab" title="Calls">📞</button>
      </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <input type="search" placeholder="Search or start new chat" />
      </header>

      <div class="chat-list">
        <div class="chat-item active">
          <img src="https://via.placeholder.com/50" alt="User" class="avatar" />
          <div class="chat-info">
            <h3>John Doe</h3>
            <p>Hey there! How are you?</p>
          </div>
        </div>
        <div class="chat-item">
          <img src="https://via.placeholder.com/50" alt="User" class="avatar" />
          <div class="chat-info">
            <h3>Jane Smith</h3>
            <p>See you tomorrow!</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Chat Section -->
    <main class="chat-window">
      <header class="chat-header">
        <div class="chat-user">
          <img src="https://via.placeholder.com/50" alt="User" class="avatar" />
          <div>
            <h3>John Doe</h3>
            <p>online</p>
          </div>
        </div>
        <div class="chat-actions">
          <span class="icon">🔍</span>
          <span class="icon">⋮</span>
        </div>
      </header>

      <div class="chat-body">
        <div class="system-message">
          <p><span class="lock">🔒</span> Messages are end-to-end encrypted.</p>
        </div>
        <div class="message received">Hey! How are you?</div>
        <div class="message sent">I'm good, thanks! You?</div>
      </div>

      <footer class="chat-footer">
        <input type="text" placeholder="Type a message" />
        <button class="send-btn">➤</button>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
